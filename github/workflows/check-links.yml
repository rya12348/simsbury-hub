name: Check Simsbury Hub links

on:
  schedule:
    - cron: "43 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check links
        id: check
        run: node check-links.js

      - name: Open or update the issue when links are broken
        if: steps.check.outputs.dead != '0'
        run: |
          gh label create link-check --description "Nightly link checker" --force || true
          num=$(gh issue list --label link-check --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file link-report.md
          else
            gh issue create --title "Broken links on Simsbury Hub" --label link-check --body-file link-report.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Close the issue when everything is fixed
        if: steps.check.outputs.dead == '0'
        run: |
          num=$(gh issue list --label link-check --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue close "$num" --comment "All links are working again."; fi
        env:
          GH_TOKEN: ${{ github.token }}
